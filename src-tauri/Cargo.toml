[package]
name = "undiffstand"
version = "0.6.0"
description = "AI-assisted diff understanding for human reviewers."
authors = ["okaryo"]
edition = "2021"

[lib]
name = "undiffstand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-store = "2.5.0"
thiserror = "2.0.20"
tempfile = "3.27.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13.0"
